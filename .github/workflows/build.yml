name: Build PS2 Launcher

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
    - name: Install git
      run: apk add --no-cache git zip

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build
      run: |
        make clean
        make

    - name: Upload compiled ELF
      uses: actions/upload-artifact@v4
      with:
        name: PS2-Launcher-Compiled
        path: |
          *.ELF
          *.elf
