name: Build PS2 Launcher

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    defaults:
      run:
        shell: sh
    steps:
    - name: Install dependencies
      run: apk add --no-cache git zip bash make python3 py3-yaml

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: git config --global --add safe.directory '*'

    - name: Download lwNBD
      run: make download_lwNBD

    - name: Generate Language Files
      run: |
        python3 lang_compiler.py --make_header --base lng_tmpl/_base.yml include/lang_autogen.h
        python3 lang_compiler.py --make_source --base lng_tmpl/_base.yml src/lang_internal.c

    - name: Build
      run: |
        if make > build_log.txt 2>&1; then
          tail -n 40 build_log.txt
        else
          error_line=$(grep -n -m 1 -E 'error:|undefined reference|No rule to make target' build_log.txt | cut -d: -f1)
          if [ -n "$error_line" ]; then
            start=$((error_line > 5 ? error_line - 5 : 1))
            end=$((error_line + 10))
            sed -n "${start},${end}p" build_log.txt | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          tail -n 100 build_log.txt
          exit 1
        fi

    - name: Upload log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt

    - name: Prepare Memory Card ELF
      run: |
        # Use the direct ELF for memory card boot. The packed ELF is kept only
        # as a build intermediate until its boot compatibility is verified.
        cp opl.elf PS2L.ELF
        python3 -c 'import struct; p=open("PS2L.ELF","rb").read(52); assert p[:4] == b"\x7fELF" and p[4] == 1 and p[5] == 1 and struct.unpack_from("<I", p, 24)[0] != 0'

    - name: Upload compiled Memory Card ELF
      uses: actions/upload-artifact@v4
      with:
        name: PS2-Launcher-Compiled
        path: PS2L.ELF
        if-no-files-found: error

    - name: Upload unpacked ELF for boot comparison
      uses: actions/upload-artifact@v4
      with:
        name: PS2-Launcher-Unpacked
        path: opl.elf
        if-no-files-found: error
