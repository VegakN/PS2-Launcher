name: Build wLaunchELF GameSir

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wlaunchelf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Mark checkout safe for git version detection
        run: git -C source config --local safe.directory "$GITHUB_WORKSPACE/source"

      - name: Compile wLaunchELF with GameSir driver
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace"
          ps2dev/ps2dev:v1.0
          sh -lc 'export PS2DEV=/usr/local/ps2dev PS2SDK=/usr/local/ps2dev/ps2sdk GSKIT=/usr/local/ps2dev/gsKit; export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2SDK/bin:$PATH"; set -eu; apk add --no-cache make git zip; builddir=$(mktemp -d); cp -a /workspace/source "$builddir/source"; cd "$builddir/source/wLaunchELF_ISR-latest"; git config --global --add safe.directory "$builddir/source"; set -o pipefail; make --trace rebuild DS34=1 ETH=1 EXFAT=0 IOP_RESET=1 2>&1 | tee wle-build.log; test -s BOOT-DS34.ELF; cp BOOT-DS34.ELF /workspace/wLaunchELF-GameSir.ELF'

      - name: Publish wLaunchELF compiler summary
        if: failure()
        working-directory: source/wLaunchELF_ISR-latest
        run: |
          if [ -f wle-build.log ]; then
            summary=$( { grep -n -i -E 'ds34usb|error:|fatal|undefined reference|no such file|not found|implicit declaration|collect2' wle-build.log || true; tail -n 40 wle-build.log; } | tail -n 180 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=wLaunchELF compiler output::$summary"
          fi

      - name: Stage generated wLaunchELF ELF
        run: test -s wLaunchELF-GameSir.ELF

      - name: Upload wLaunchELF build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF-GameSir-build-log
          path: source/wLaunchELF_ISR-latest/wle-build.log

      - name: Upload wLaunchELF GameSir ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF-GameSir
          path: wLaunchELF-GameSir.ELF
          if-no-files-found: error
