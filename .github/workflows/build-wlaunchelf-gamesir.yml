name: Build wLaunchELF GameSir

on:
  push:
    branches: ["codex/opl-gamesir-vibration"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wlaunchelf:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build dependencies
        run: apk add --no-cache make git zip

      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone --depth=1 --branch "$GITHUB_REF_NAME" "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" source
          git -C source checkout --detach "$GITHUB_SHA"

      - name: Compile wLaunchELF with GameSir driver
        working-directory: source/wLaunchELF_ISR-latest
        run: |
          set -eu
          make --trace rebuild DS34=1 ETH=1 EXFAT=1 IOP_RESET=1
          test -s BOOT-DS34.ELF

      - name: Publish compact wLaunchELF GameSir ELF
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p artifacts
          cp wLaunchELF_ISR-latest/BOOT-DS34.ELF artifacts/wLaunchELF-GameSir.ELF
          git add -f artifacts/wLaunchELF-GameSir.ELF
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish wLaunchELF GameSir build"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$GITHUB_REF_NAME"
