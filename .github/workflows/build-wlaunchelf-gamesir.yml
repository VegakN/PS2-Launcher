name: Build wLaunchELF GameSir

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wlaunchelf:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build dependencies
        run: apk add --no-cache make git zip

      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git clone --depth=1 --branch "$GITHUB_REF_NAME" "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" source 2>clone.err
          rc=$?
          if [ "$rc" -ne 0 ]; then
            summary=$(sed -E 's#https://x-access-token:[^@]+@#https://x-access-token:REDACTED@#g' clone.err | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Checkout failure::$summary"
            exit "$rc"
          fi
          git -C source checkout --detach "$GITHUB_SHA"

      - name: Mark checkout safe for git version detection
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/source"

      - name: Compile wLaunchELF with GameSir driver
        working-directory: source/wLaunchELF_ISR-latest
        run: set -o pipefail; make --trace rebuild DS34=1 ETH=1 EXFAT=0 IOP_RESET=1 2>&1 | tee wle-build.log

      - name: Publish wLaunchELF compiler summary
        if: failure()
        working-directory: source/wLaunchELF_ISR-latest
        run: |
          if [ -f wle-build.log ]; then
            summary=$( { grep -n -i -E 'ds34usb|error:|fatal|undefined reference|no such file|not found|implicit declaration|collect2' wle-build.log || true; tail -n 40 wle-build.log; } | tail -n 180 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=wLaunchELF compiler output::$summary"
          fi

      - name: Stage generated wLaunchELF ELF
        run: |
          set -eu
          elf=$(find source/wLaunchELF_ISR-latest -maxdepth 1 -type f -iname '*.elf' | head -n 1)
          test -n "$elf"
          cp "$elf" source/wLaunchELF-GameSir.ELF

      - name: Upload wLaunchELF build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF-GameSir-build-log
          path: source/wLaunchELF_ISR-latest/wle-build.log

      - name: Upload wLaunchELF GameSir ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF-GameSir
          path: /__w/PS2-Launcher/PS2-Launcher/source/wLaunchELF-GameSir.ELF
          if-no-files-found: error
