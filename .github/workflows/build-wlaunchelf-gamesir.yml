name: Build wLaunchELF GameSir

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wlaunchelf:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build dependencies
        run: apk add --no-cache make git zip

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout safe for git version detection
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile wLaunchELF with GameSir driver
        working-directory: wLaunchELF_ISR-latest
        run: set -o pipefail; make --trace rebuild DS34=1 ETH=1 EXFAT=0 IOP_RESET=1 2>&1 | tee wle-build.log

      - name: Upload wLaunchELF build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF-GameSir-build-log
          path: wLaunchELF_ISR-latest/wle-build.log

      - name: Upload wLaunchELF GameSir ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF-GameSir
          path: wLaunchELF_ISR-latest/BOOT*-DS34*.ELF
          if-no-files-found: error
